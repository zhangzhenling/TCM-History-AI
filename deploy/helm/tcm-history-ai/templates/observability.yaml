{{- /*
可观测性栈：Prometheus + Grafana + Loki + Jaeger
通过 .Values.observability.enabled 控制是否启用
*/ -}}
{{- if .Values.observability.enabled }}
{{- $root := . -}}
---
# ============================================================
# Prometheus — ServiceAccount
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
---
# ============================================================
# Prometheus — ClusterRole
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-{{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
# ============================================================
# Prometheus — ClusterRoleBinding
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-{{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-{{ include "tcm.namespace" $root }}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ include "tcm.namespace" $root }}
---
# ============================================================
# Prometheus — ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: {{ include "tcm.fullName" $root }}
        environment: {{ $root.Values.global.appEnv }}

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      {{- range $name, $cfg := $root.Values.backend }}
      - job_name: "{{ $name }}"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ include "tcm.namespace" $root }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: {{ $name }}
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __meta_kubernetes_pod_container_port_number
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      {{- end }}

      - job_name: "rabbitmq"
        static_configs:
          - targets: ["rabbitmq.{{ include "tcm.namespace" $root }}.svc.cluster.local:15672"]
        metrics_path: "/metrics"
        params:
          family: ["rabbitmq"]

      - job_name: "kubernetes-service-endpoints"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["{{ include "tcm.namespace" $root }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
---
# ============================================================
# Prometheus — Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 9090
      targetPort: http-web
      protocol: TCP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
---
# ============================================================
# Prometheus — StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  serviceName: prometheus
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/version: {{ $root.Values.observability.prometheus.image | trimPrefix "prom/prometheus:" | quote }}
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: {{ $root.Values.observability.prometheus.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $root.Values.observability.prometheus.retention }}
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles
            - --web.enable-lifecycle
          ports:
            - name: http-web
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ $root.Values.global.storageClass }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $root.Values.observability.prometheus.storage }}
---
# ============================================================
# Grafana — Secret（admin 凭据）
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
type: Opaque
data:
  admin-user: {{ $root.Values.observability.grafana.adminUser | b64enc | quote }}
  admin-password: {{ $root.Values.observability.grafana.adminPassword | b64enc | quote }}
---
# ============================================================
# Grafana — ConfigMap（datasources）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.{{ include "tcm.namespace" $root }}.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.{{ include "tcm.namespace" $root }}.svc.cluster.local:3100
        access: proxy
        editable: true
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.{{ include "tcm.namespace" $root }}.svc.cluster.local:16686
        access: proxy
        editable: true
---
# ============================================================
# Grafana — ConfigMap（dashboards provider）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
# ============================================================
# Grafana — Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 3000
      targetPort: http-web
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
---
# ============================================================
# Grafana — Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    spec:
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: {{ $root.Values.observability.grafana.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http-web
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_INSTALL_PLUGINS
              value: ""
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
# ============================================================
# Grafana — PVC
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.grafana.image | trimPrefix "grafana/grafana:" | quote }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  storageClassName: {{ $root.Values.global.storageClass }}
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $root.Values.observability.grafana.storage }}
---
# ============================================================
# Loki — ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.loki.image | trimPrefix "grafana/loki:" | quote }}
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    limits_config:
      retention_period: {{ $root.Values.observability.loki.retention }}
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_streams_per_user: 10000
      max_query_length: 721h
      max_query_parallelism: 32

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-tmp
      alertmanager_url: http://localhost:9093

    analytics:
      reporting_enabled: false
---
# ============================================================
# Loki — Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.loki.image | trimPrefix "grafana/loki:" | quote }}
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
      protocol: TCP
    - name: grpc
      port: 9096
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ $root.Release.Name }}
---
# ============================================================
# Loki — StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.loki.image | trimPrefix "grafana/loki:" | quote }}
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  serviceName: loki
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/version: {{ $root.Values.observability.loki.image | trimPrefix "grafana/loki:" | quote }}
        app.kubernetes.io/component: logging
        app.kubernetes.io/managed-by: {{ $root.Release.Service }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: loki
          image: {{ $root.Values.observability.loki.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http-metrics
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9096
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ $root.Values.global.storageClass }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $root.Values.observability.loki.storage }}
---
# ============================================================
# Jaeger — Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.jaeger.image | trimPrefix "jaegertracing/all-in-one:" | quote }}
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: jaeger-thrift
      port: 6831
      targetPort: jaeger-thrift
      protocol: UDP
    - name: http-ui
      port: 16686
      targetPort: http-ui
      protocol: TCP
    - name: http-collector
      port: 14268
      targetPort: http-collector
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: {{ $root.Release.Name }}
---
# ============================================================
# Jaeger — Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.observability.jaeger.image | trimPrefix "jaegertracing/all-in-one:" | quote }}
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/version: {{ $root.Values.observability.jaeger.image | trimPrefix "jaegertracing/all-in-one:" | quote }}
        app.kubernetes.io/component: tracing
        app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    spec:
      containers:
        - name: jaeger
          image: {{ $root.Values.observability.jaeger.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          env:
            - name: SPAN_STORAGE
              value: memory
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - name: jaeger-thrift
              containerPort: 6831
              protocol: UDP
            - name: http-ui
              containerPort: 16686
              protocol: TCP
            - name: http-collector
              containerPort: 14268
