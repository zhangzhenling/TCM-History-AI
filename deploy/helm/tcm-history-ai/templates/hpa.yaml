{{- /*
HPA：gateway 与 ai-service（CPU 70% 阈值）
仅当 backend.<svc>.hpa.enabled 为 true 时创建
*/ -}}
{{- $root := . -}}
{{- range $name, $cfg := .Values.backend }}
{{- with $cfg.hpa }}
{{- if .enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    {{- include "tcm.serviceLabels" (list $root $name $cfg.component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .cpuUtilization }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
{{- end }}
{{- end }}
{{- end }}
