{{- /*
敏感凭据 Secret（占位值，生产必须通过 --set 或外部 secret 覆盖）

两种注入方式（互斥）：
  1. 默认（externalSecrets.enabled=false）：本模板渲染 stringData，由 helm --set 注入占位/真实值
  2. ExternalSecrets（externalSecrets.enabled=true）：跳过 stringData 渲染，
     由 ExternalSecrets Operator 从 Vault/AWS SM 同步生成同名 Secret（见 external-secrets.yaml）

!!! 警告：禁止在 values.yaml 中明文写入真实密码，所有值必须为 CHANGE_ME 占位 !!!
*/ -}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tcm.fullName" . }}-secret
  namespace: {{ include "tcm.namespace" . }}
  labels:
    {{- include "tcm.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  TCM_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  TCM_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  TCM_NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  TCM_MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  TCM_MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  TCM_MEILI_API_KEY: {{ .Values.secrets.meiliApiKey | quote }}
  TCM_RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  TCM_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  TCM_LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  TCM_EMBEDDING_API_KEY: {{ .Values.secrets.embeddingApiKey | quote }}
{{- end }}
