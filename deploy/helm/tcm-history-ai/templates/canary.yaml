{{- /*
金丝雀发布（Canary Release）模板 — 以 gateway 服务为例
通过 .Values.canary.enabled 控制是否启用

原理：
  Stable Deployment（稳定版）由 backend-deployments.yaml 负责创建
  Canary Deployment（金丝雀版）由此模板创建
  两个 Deployment 使用相同的 selector，通过同一个 Service 按副本数比例分流

使用方式：
  helm upgrade --set canary.enabled=true --set canary.gateway.imageTag=v2.2.0
*/ -}}
{{- if .Values.canary.enabled }}
{{- $root := . -}}
{{- $gatewayCfg := index .Values.backend "gateway" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: {{ include "tcm.namespace" $root }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Values.canary.gateway.imageTag | quote }}
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/part-of: canary
    canary.tcm-history.ai/role: canary
spec:
  replicas: {{ $root.Values.canary.gateway.replicas }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tcm.selectorLabels" (list $root "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/version: {{ $root.Values.canary.gateway.imageTag | quote }}
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/managed-by: {{ $root.Release.Service }}
        app.kubernetes.io/part-of: canary
        canary.tcm-history.ai/role: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $gatewayCfg.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        {{- toYaml $root.Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: gateway
          # Canary 镜像：优先用 imageDigest（如金丝雀镜像也走 digest），否则用 canary.gateway.imageTag
          {{- if $root.Values.global.imageDigest }}
          image: {{ printf "%s/%s@%s" $root.Values.global.imageRegistry "gateway" $root.Values.global.imageDigest }}
          {{- else }}
          image: {{ printf "%s/%s:%s" $root.Values.global.imageRegistry "gateway" $root.Values.canary.gateway.imageTag }}
          {{- end }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ $gatewayCfg.port }}
              protocol: TCP
          env:
            - name: TCM_APP_NAME
              value: "gateway"
            - name: TCM_APP_ENV
              value: {{ $root.Values.global.appEnv | quote }}
            - name: TCM_HTTP_PORT
              value: {{ $gatewayCfg.port | quote }}
            - name: TCM_LOG_LEVEL
              value: {{ $root.Values.global.logLevel | quote }}
            {{- with $gatewayCfg.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "tcm.fullName" $root }}-config
            - secretRef:
                name: {{ include "tcm.fullName" $root }}-secret
          resources:
            {{- toYaml $gatewayCfg.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
