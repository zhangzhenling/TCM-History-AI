{{- /*
ExternalSecrets Operator 集成模板

启用条件：.Values.externalSecrets.enabled == true
依赖：集群已安装 external-secrets-operator（https://external-secrets.io）

渲染产物：
  1. SecretStore（或 ClusterSecretStore）：定义外部 secret 后端（Vault / AWS SM / GCP SM / Azure KV）
  2. ExternalSecret：声明 K8s Secret 与外部 provider 的 key 映射，由 ESO Controller 同步
  3. 空 Secret 骨架：作为 ExternalSecret 同步的目标占位（ESO 会填充 data）

启用后 templates/secret.yaml 中的 stringData 不再渲染（避免覆盖 ESO 同步的凭据）。
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . -}}
{{- $es := .Values.externalSecrets -}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ $es.secretStoreName }}
  namespace: {{ include "tcm.namespace" . }}
  labels:
    {{- include "tcm.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  {{- if eq $es.backend "vault" }}
  provider:
    vault:
      server: {{ $es.vault.server | quote }}
      path: {{ $es.vault.path | quote }}
      version: {{ $es.vault.kvVersion | quote }}
      auth:
        {{- if eq $es.vault.auth.method "kubernetes" }}
        kubernetes:
          mountPath: {{ printf "/v1/auth/%s/login" $es.vault.auth.mount | quote }}
          role: {{ $es.vault.auth.role | quote }}
        {{- else }}
        # 其他认证方式（token / approle / ldap / jwt）由运维在外部 SecretStore 中配置
        tokenSecretRef:
          name: {{ include "tcm.fullName" . }}-vault-token
          key: token
        {{- end }}
  {{- else if eq $es.backend "aws" }}
  provider:
    aws:
      service: SecretsManager
      region: {{ $es.aws.region | quote }}
      {{- with $es.aws.role }}
      role: {{ . | quote }}
      {{- end }}
  {{- else }}
  # backend=gcp/azure 暂未内置模板，请通过 values 覆盖 SecretStore 或自行扩展
  provider:
    custom: {}
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tcm.fullName" . }}-external-secret
  namespace: {{ include "tcm.namespace" . }}
  labels:
    {{- include "tcm.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: 1h               # 同步间隔（生产可调，平衡实时性与 API 调用频率）
  secretStoreRef:
    name: {{ $es.secretStoreName }}
    kind: SecretStore
  target:
    # 同步目标：与 templates/secret.yaml 同名，业务 Pod 通过 envFrom.secretRef 引用
    name: {{ include "tcm.fullName" . }}-secret
    creationPolicy: Owner           # ESO 拥有该 Secret 生命周期
    deletionPolicy: Retain          # 删除 ExternalSecret 时保留 Secret（防止误删）
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
