# TCM-History-AI Helm Chart 默认值（dev 友好）
# 生产覆盖见 values.prod.yaml，开发覆盖见 values.dev.yaml
# 端口取自 backend/*/internal/conf/config.dev.yaml 实际确认值

# ===== 全局 =====
global:
  imageRegistry: ghcr.io/tcm-history-ai
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull-secret
  storageClass: standard      # PVC storageClass，生产建议换 fast-ssd
  namespace: tcm-history-ai
  appVersion: "2.1"
  logLevel: info
  appEnv: dev
  # 镜像 digest 固定（生产建议固定为 sha256，覆盖 tag 可变性）
  # 提供后所有 Deployment/StatefulSet 镜像引用改为 <registry>/<svc>@<digest>，
  # 优先级高于 global.appVersion；为空时回落到 <registry>/<svc>:<appVersion>
  imageDigest: ""

# ===== Ingress =====
ingress:
  enabled: true
  className: nginx
  host: api.tcm-history.local
  tls:
    enabled: false
    secretName: tcm-tls
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "200"

# ===== 中间件（StatefulSet，单实例为默认；prod 通过 values.prod.yaml 调整资源/存储）=====
middleware:
  postgres:
    enabled: true
    image: postgres:16-alpine
    port: 5432
    replicas: 1
    storage: 50Gi
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 4Gi }
  redis:
    enabled: true
    image: redis:7-alpine
    port: 6379
    replicas: 1
    storage: 10Gi
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  neo4j:
    enabled: true
    image: neo4j:5-community
    ports: { http: 7474, bolt: 7687 }
    replicas: 1
    storage: 50Gi
    logStorage: 10Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  milvus:
    enabled: true
    image: milvusdb/milvus:v2.4.0
    etcdImage: quay.io/coreos/etcd:v3.5.5
    ports: { grpc: 19530, metrics: 9091 }
    replicas: 1
    storage: 50Gi
    etcdStorage: 10Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    etcdResources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  minio:
    enabled: true
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    ports: { api: 9000, console: 9001 }
    replicas: 1
    storage: 100Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  meilisearch:
    enabled: true
    image: getmeili/meilisearch:v1.6
    port: 7700
    replicas: 1
    storage: 20Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  rabbitmq:
    enabled: true
    image: rabbitmq:3.13-management-alpine
    ports: { amqp: 5672, management: 15672 }
    replicas: 1
    storage: 20Gi
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

# ===== 后端微服务（Deployment + Service，用 range 遍历，见 templates/backend-deployments.yaml）=====
# 端口取自 config.dev.yaml 实际值：gateway 8080 / user 8081 / history 8082 /
#   knowledge 8084 / graph 8085 / ai 8086 / learning 8087
backend:
  gateway:
    port: 8080
    replicas: 1
    component: api-gateway
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      cpuUtilization: 70
  user-service:
    port: 8081
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  history-service:
    port: 8082
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  knowledge-service:
    port: 8084
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    # 额外环境变量（覆盖默认 configmap）
    env:
      TCM_MINIO_BUCKET_NAME: tcm-knowledge
      TCM_EMBEDDING_PROVIDER: local
      TCM_EMBEDDING_MODEL: bge-large-zh-v1.5
  graph-service:
    port: 8085
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
  ai-service:
    port: 8086
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 6
      cpuUtilization: 70
    env:
      TCM_LLM_PROVIDER: openai
      TCM_LLM_MODEL: gpt-4o-mini
      TCM_LLM_ENABLED: "true"
  learning-service:
    port: 8087
    replicas: 1
    component: microservice
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# ===== 凭据（占位，生产必须替换；可用 --set 或外部 secret 覆盖）=====
# !!! 警告：以下均为 CHANGE_ME 占位值，禁止直接用于生产 !!!
# 生产推荐流程（任选其一）：
#   1. helm upgrade --set secrets.dbPassword=<strong-password> ...（短期）
#   2. 启用 externalSecrets.enabled=true，由 ExternalSecrets Operator 从 Vault/AWS SM 拉取（推荐）
# 详见 doc/14-部署方案.md 第 9.3 节、doc/16-Kubernetes部署.md 第 4.2 节
secrets:
  dbPassword: "CHANGE_ME"
  redisPassword: "CHANGE_ME"
  neo4jPassword: "CHANGE_ME"
  minioAccessKey: "CHANGE_ME"
  minioSecretKey: "CHANGE_ME"
  meiliApiKey: "CHANGE_ME"
  rabbitmqPassword: "CHANGE_ME"
  jwtSecret: "CHANGE_ME"
  llmApiKey: "CHANGE_ME"
  embeddingApiKey: "CHANGE_ME"

# ===== ExternalSecrets Operator 集成（生产推荐）=====
# 启用后由 ExternalSecrets Operator 从外部 secret store（Vault / AWS Secrets Manager /
# GCP Secret Manager / Azure Key Vault）自动同步凭据到 K8s Secret，避免明文入库。
# 前置：集群已安装 external-secrets-operator（https://external-secrets.io）
# 启用后 templates/secret.yaml 不再渲染 stringData，改由 ExternalSecret 同步生成
externalSecrets:
  enabled: false
  # SecretStore 类型：vault / aws / gcp / azure
  backend: vault
  # SecretStore 名称（参数化，便于多环境复用）
  secretStoreName: "tcm-vault-store"
  # Vault 配置（backend=vault 时生效）
  vault:
    server: "https://vault.tcm-history.ai"
    path: "secret"
    kvVersion: "2"
    auth:
      # kubernetes 服务账号认证（推荐），token 由 SA 自动挂载
      method: kubernetes
      mount: "kubernetes"
      role: "tcm-history-ai"
  # AWS Secrets Manager 配置（backend=aws 时生效）
  aws:
    region: "us-east-1"
    role: ""
  # 外部 secret 的 key 映射：K8s Secret key → 外部 provider path
  # 例如 Vault: secret/data/tcm-history-ai/db → TCM_DB_PASSWORD
  data:
    - secretKey: TCM_DB_PASSWORD
      remoteRef:
        key: "tcm-history-ai/db"
        property: "password"
    - secretKey: TCM_REDIS_PASSWORD
      remoteRef:
        key: "tcm-history-ai/redis"
        property: "password"
    - secretKey: TCM_NEO4J_PASSWORD
      remoteRef:
        key: "tcm-history-ai/neo4j"
        property: "password"
    - secretKey: TCM_MINIO_ACCESS_KEY
      remoteRef:
        key: "tcm-history-ai/minio"
        property: "accessKey"
    - secretKey: TCM_MINIO_SECRET_KEY
      remoteRef:
        key: "tcm-history-ai/minio"
        property: "secretKey"
    - secretKey: TCM_MEILI_API_KEY
      remoteRef:
        key: "tcm-history-ai/meilisearch"
        property: "masterKey"
    - secretKey: TCM_RABBITMQ_PASSWORD
      remoteRef:
        key: "tcm-history-ai/rabbitmq"
        property: "password"
    - secretKey: TCM_JWT_SECRET
      remoteRef:
        key: "tcm-history-ai/jwt"
        property: "secret"
    - secretKey: TCM_LLM_API_KEY
      remoteRef:
        key: "tcm-history-ai/llm"
        property: "apiKey"
    - secretKey: TCM_EMBEDDING_API_KEY
      remoteRef:
        key: "tcm-history-ai/embedding"
        property: "apiKey"

# ===== 非敏感全局配置（注入 ConfigMap，TCM_ 前缀）=====
config:
  dbDriver: postgres
  dbHost: postgres
  dbPort: "5432"
  dbUser: tcm
  dbName: tcm_history
  dbSslmode: disable
  redisHost: redis
  redisPort: "6379"
  neo4jHost: neo4j
  neo4jPort: "7687"
  neo4jUser: neo4j
  milvusHost: milvus
  milvusPort: "19530"
  minioEndpoint: minio:9000
  minioBucket: tcm-history
  meiliHost: meilisearch
  meiliPort: "7700"
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"
  rabbitmqUser: tcm
  rabbitmqVhost: /tcm
  jwtIssuer: tcm-history-ai
  tracingOtlpEndpoint: otel-collector:4317
  tracingEnabled: "false"

# ===== 可观测性栈（Prometheus + Grafana + Loki + Jaeger）=====
# 生产环境建议启用，开发环境可关闭以节省资源
observability:
  enabled: false
  prometheus:
    image: prom/prometheus:v2.53.0
    retention: 15d
    storage: 10Gi
  grafana:
    image: grafana/grafana:11.2.0
    adminUser: admin
    # !!! 警告：占位值，生产必须通过 --set observability.grafana.adminPassword=<strong-password> 覆盖 !!!
    adminPassword: "CHANGE_ME"
    storage: 5Gi
  loki:
    image: grafana/loki:3.2.0
    retention: 7d
    storage: 20Gi
  jaeger:
    image: jaegertracing/all-in-one:1.60

# ===== 金丝雀发布（Canary Release）=====
# 以 gateway 服务为例，启用后创建 canary 版本 Deployment
# 通过调整 stable/canary 副本数比例控制流量比例
canary:
  enabled: false
  gateway:
    replicas: 1
    imageTag: canary

# ===== 网络策略（NetworkPolicy）=====
# 生产环境建议启用，提升安全性（默认拒绝所有入站，白名单模式）
# 需要集群支持 NetworkPolicy（Calico / Cilium 等 CNI 插件）
networkPolicy:
  enabled: false

# ===== 备份配置（CronJob）=====
# 生产环境建议启用，定期备份 PostgreSQL 和 Neo4j 数据
backup:
  enabled: false
  retentionDays: 7
  storage: 100Gi
  postgres:
    schedule: "0 2 * * *"
  neo4j:
    schedule: "0 3 * * *"
