# 生产环境覆盖值
# 用法：helm install tcm-history-ai deploy/helm/tcm-history-ai -f deploy/helm/tcm-history-ai/values.prod.yaml
global:
  imageRegistry: ghcr.io/tcm-history-ai
  imagePullPolicy: IfNotPresent
  storageClass: fast-ssd        # 生产换更高性能 SC
  logLevel: warn
  appEnv: prod
  # 生产环境固定镜像 tag 到不可变版本号，避免 latest 可变 tag
  # 升级时建议改 imageDigest 为 sha256（由 CI 在镜像构建后注入），保证可追溯与可回滚
  # 例：imageDigest: "sha256:abc123def456..."
  imageDigest: ""

# Ingress 启用 TLS
ingress:
  enabled: true
  host: api.tcm-history.ai
  tls:
    enabled: true
    secretName: tcm-tls
    clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "500"

# 中间件生产配额（单实例仍为 StatefulSet；多副本高可用建议改用 Operator，见 doc/16-Kubernetes部署.md）
middleware:
  postgres:
    storage: 200Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  redis:
    storage: 50Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  neo4j:
    storage: 200Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  milvus:
    storage: 200Gi
    etcdStorage: 50Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  minio:
    storage: 500Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  meilisearch:
    storage: 100Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  rabbitmq:
    storage: 100Gi
    resources:
      requests: { cpu: "2", memory: 2Gi }
      limits: { cpu: "4", memory: 4Gi }

# 后端微服务生产副本数与资源（参考 doc/14-部署方案.md 第 11.1 节）
backend:
  gateway:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      cpuUtilization: 70
  user-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1500m", memory: 1Gi }
  history-service:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "3", memory: 2Gi }
  knowledge-service:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "4", memory: 3Gi }
  graph-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
  ai-service:
    replicas: 3
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "4", memory: 4Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      cpuUtilization: 70
  learning-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }

# 生产环境启用可观测性栈（Prometheus + Grafana + Loki + Jaeger）
observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.53.0
    retention: 15d
    storage: 10Gi
  grafana:
    image: grafana/grafana:11.2.0
    adminUser: admin
    # !!! 警告：占位值，生产必须通过 --set observability.grafana.adminPassword=<strong-password> 覆盖 !!!
    adminPassword: "CHANGE_ME"
    storage: 5Gi
  loki:
    image: grafana/loki:3.2.0
    retention: 7d
    storage: 20Gi
  jaeger:
    image: jaegertracing/all-in-one:1.60

# 生产环境启用网络策略（安全加固）
networkPolicy:
  enabled: true

# 生产环境启用定期备份
backup:
  enabled: true
  retentionDays: 14
  storage: 200Gi
  postgres:
    schedule: "0 2 * * *"
  neo4j:
    schedule: "0 3 * * *"

# ===== 凭据（生产强制占位，必须通过 --set 或 ExternalSecret 注入）=====
# !!! 警告：禁止在 values.prod.yaml 中明文写入真实密码 !!!
# 推荐流程：
#   1. 启用 externalSecrets.enabled=true，由 ExternalSecrets Operator 从 Vault/AWS SM 拉取
#   2. 短期可 helm upgrade --set secrets.dbPassword=<strong-password> ... 临时注入
secrets:
  dbPassword: "CHANGE_ME"            # PostgreSQL 密码，必须为强随机串（≥ 32 字节）
  redisPassword: "CHANGE_ME"         # Redis 密码
  neo4jPassword: "CHANGE_ME"         # Neo4j 密码
  minioAccessKey: "CHANGE_ME"        # MinIO Access Key
  minioSecretKey: "CHANGE_ME"        # MinIO Secret Key
  meiliApiKey: "CHANGE_ME"           # Meilisearch Master Key（≥ 16 字节）
  rabbitmqPassword: "CHANGE_ME"      # RabbitMQ 密码
  jwtSecret: "CHANGE_ME"             # JWT 签名密钥（≥ 32 字节随机串）
  llmApiKey: "CHANGE_ME"             # LLM API Key（建议走 Vault 动态获取）
  embeddingApiKey: "CHANGE_ME"       # Embedding API Key

# ===== ExternalSecrets Operator（生产推荐启用）=====
# 启用后凭据从 Vault/AWS Secrets Manager 动态拉取，不入 GitOps 仓库
# 前置：集群已安装 external-secrets-operator（https://external-secrets.io）
# 启用后 templates/secret.yaml 不再渲染 stringData，改由 ExternalSecret 同步生成
externalSecrets:
  enabled: false                     # 生产建议改 true，并配置 backend / vault.server 等
  backend: vault                     # vault / aws / gcp / azure
  secretStoreName: "tcm-vault-store-prod"
  vault:
    server: "https://vault.tcm-history.ai"
    path: "secret"
    kvVersion: "2"
    auth:
      method: kubernetes
      mount: "kubernetes"
      role: "tcm-history-ai-prod"
  aws:
    region: "us-east-1"
    role: "tcm-history-ai-prod-role"
