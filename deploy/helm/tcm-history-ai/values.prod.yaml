# 生产环境覆盖值
# 用法：helm install tcm-history-ai deploy/helm/tcm-history-ai -f deploy/helm/tcm-history-ai/values.prod.yaml
global:
  imageRegistry: ghcr.io/tcm-history-ai
  imagePullPolicy: IfNotPresent
  storageClass: fast-ssd        # 生产换更高性能 SC
  logLevel: warn
  appEnv: prod

# Ingress 启用 TLS
ingress:
  enabled: true
  host: api.tcm-history.ai
  tls:
    enabled: true
    secretName: tcm-tls
    clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "500"

# 中间件生产配额（单实例仍为 StatefulSet；多副本高可用建议改用 Operator，见 doc/16-Kubernetes部署.md）
middleware:
  postgres:
    storage: 200Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  redis:
    storage: 50Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  neo4j:
    storage: 200Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  milvus:
    storage: 200Gi
    etcdStorage: 50Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
  minio:
    storage: 500Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  meilisearch:
    storage: 100Gi
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
  rabbitmq:
    storage: 100Gi
    resources:
      requests: { cpu: "2", memory: 2Gi }
      limits: { cpu: "4", memory: 4Gi }

# 后端微服务生产副本数与资源（参考 doc/14-部署方案.md 第 11.1 节）
backend:
  gateway:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      cpuUtilization: 70
  user-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1500m", memory: 1Gi }
  history-service:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "3", memory: 2Gi }
  knowledge-service:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "4", memory: 3Gi }
  graph-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
  ai-service:
    replicas: 3
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "4", memory: 4Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      cpuUtilization: 70
  learning-service:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }

# 生产环境启用可观测性栈（Prometheus + Grafana + Loki + Jaeger）
observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.53.0
    retention: 15d
    storage: 10Gi
  grafana:
    image: grafana/grafana:11.2.0
    adminUser: admin
    adminPassword: admin123
    storage: 5Gi
  loki:
    image: grafana/loki:3.2.0
    retention: 7d
    storage: 20Gi
  jaeger:
    image: jaegertracing/all-in-one:1.60

# 生产环境启用网络策略（安全加固）
networkPolicy:
  enabled: true

# 生产环境启用定期备份
backup:
  enabled: true
  retentionDays: 14
  storage: 200Gi
  postgres:
    schedule: "0 2 * * *"
  neo4j:
    schedule: "0 3 * * *"
