# Neo4j 5 社区版单实例 StatefulSet（含 APOC 插件）
# 生产高可用建议改用官方 Helm Chart 因果集群（见 doc/16-Kubernetes部署.md 第 3.3 节）
# 端口：7474（HTTP）/ 7687（Bolt）
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "5"
    app.kubernetes.io/component: graph-database
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
  selector:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/instance: tcm-history-ai
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "5"
    app.kubernetes.io/component: graph-database
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: neo4j
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
      app.kubernetes.io/instance: tcm-history-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/instance: tcm-history-ai
        app.kubernetes.io/version: "5"
        app.kubernetes.io/component: graph-database
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5-community
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              value: neo4j/$(NEO4J_PASSWORD)
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcm-secret
                  key: TCM_NEO4J_PASSWORD
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_memory_heap_initial__size
              value: 1G
            - name: NEO4J_server_memory_heap_max__size
              value: 2G
            - name: NEO4J_server_memory_pagecache_size
              value: 1G
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 7474
              protocol: TCP
            - name: bolt
              containerPort: 7687
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: logs
      spec:
        storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
