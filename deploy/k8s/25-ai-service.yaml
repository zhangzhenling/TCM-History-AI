# AI Service 微服务（LLM 调用、Agent 编排、RAG 检索编排）
# 端口：8086（HTTP）
# 镜像构建：docker build -f backend/ai-service/Dockerfile -t ghcr.io/tcm-history-ai/ai-service:latest backend/
# 含 HPA（CPU 70% 阈值）；GPU 副本见 doc/16-Kubernetes部署.md 第 4.3 节，本清单为 CPU 副本
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "2.1"
    app.kubernetes.io/component: microservice
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8086
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: tcm-history-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "2.1"
    app.kubernetes.io/component: microservice
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/instance: tcm-history-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/instance: tcm-history-ai
        app.kubernetes.io/version: "2.1"
        app.kubernetes.io/component: microservice
        app.kubernetes.io/managed-by: kubectl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ai-service
          image: ghcr.io/tcm-history-ai/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: TCM_APP_NAME
              value: ai-service
            - name: TCM_APP_ENV
              value: prod
            - name: TCM_HTTP_PORT
              value: "8086"
            - name: TCM_LOG_LEVEL
              value: warn
            # AI 服务 LLM 适配器配置
            - name: TCM_LLM_PROVIDER
              value: "openai"
            - name: TCM_LLM_MODEL
              value: "gpt-4o-mini"
            - name: TCM_LLM_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: tcm-config
            - secretRef:
                name: tcm-secret
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: ghcr-pull-secret
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
