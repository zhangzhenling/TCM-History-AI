# PostgreSQL 16 单实例 StatefulSet
# 生产高可用建议改用 CloudNativePG Operator（见 doc/16-Kubernetes部署.md 第 3.1 节）
# 端口：5432（容器内 / Service）
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "16"
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: tcp-pg
      port: 5432
      targetPort: tcp-pg
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: tcm-history-ai
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "16"
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: tcm-history-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: tcm-history-ai
        app.kubernetes.io/version: "16"
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-pg
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: tcm-config
                  key: TCM_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcm-secret
                  key: TCM_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tcm-config
                  key: TCM_DB_DBNAME
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
