# Grafana 可视化与仪表盘（监控 UI）
# 端口：3000（HTTP UI）
# 镜像：grafana/grafana:11.2.0
# 数据源：Prometheus + Loki + Jaeger
# 数据持久化：5Gi PVC
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  admin-user: YWRtaW4=
  admin-password: YWRtaW4xMjM=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.tcm-history-ai.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.tcm-history-ai.svc.cluster.local:3100
        access: proxy
        editable: true
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.tcm-history-ai.svc.cluster.local:16686
        access: proxy
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 3000
      targetPort: http-web
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: tcm-history-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: tcm-history-ai
        app.kubernetes.io/version: "11.2.0"
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-web
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_INSTALL_PLUGINS
              value: ""
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "11.2.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
