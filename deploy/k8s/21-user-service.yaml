# User Service 微服务（用户、鉴权、权限）
# 端口：8081（HTTP）
# 镜像构建：docker build -f backend/user-service/Dockerfile -t ghcr.io/tcm-history-ai/user-service:latest backend/
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "2.1"
    app.kubernetes.io/component: microservice
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: tcm-history-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: tcm-history-ai
    app.kubernetes.io/version: "2.1"
    app.kubernetes.io/component: microservice
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/instance: tcm-history-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: tcm-history-ai
        app.kubernetes.io/version: "2.1"
        app.kubernetes.io/component: microservice
        app.kubernetes.io/managed-by: kubectl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-service
          image: ghcr.io/tcm-history-ai/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: TCM_APP_NAME
              value: user-service
            - name: TCM_APP_ENV
              value: prod
            - name: TCM_HTTP_PORT
              value: "8081"
            - name: TCM_LOG_LEVEL
              value: warn
          envFrom:
            - configMapRef:
                name: tcm-config
            - secretRef:
                name: tcm-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: ghcr-pull-secret
