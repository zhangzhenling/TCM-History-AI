# TCM-History-AI 敏感凭据（占位）
# !!! 警告：以下均为占位值，生产部署前必须替换 !!!
# 生产推荐流程：
#   1. 短期：用 Sealed Secrets / SOPS 加密后提交 GitOps 仓库
#   2. 长期：高敏密钥（LLM API Key）走 HashiCorp Vault 动态获取，不入仓库
# 详见 doc/14-部署方案.md 第 9.3 节、doc/16-Kubernetes部署.md 第 4.2 节
apiVersion: v1
kind: Secret
metadata:
  name: tcm-secret
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: tcm-history-ai
    app.kubernetes.io/component: secret
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # ===== PostgreSQL 密码 =====
  TCM_DB_PASSWORD: "postgres-password-placeholder"

  # ===== Redis 密码 =====
  TCM_REDIS_PASSWORD: "redis-password-placeholder"

  # ===== Neo4j 密码 =====
  TCM_NEO4J_PASSWORD: "neo4j-password-placeholder"

  # ===== MinIO 访问密钥 =====
  TCM_MINIO_ACCESS_KEY: "minio-accesskey-placeholder"
  TCM_MINIO_SECRET_KEY: "minio-secretkey-placeholder"

  # ===== Meilisearch Master Key =====
  TCM_MEILI_API_KEY: "meili-masterkey-placeholder"

  # ===== RabbitMQ 密码 =====
  TCM_RABBITMQ_PASSWORD: "rabbitmq-password-placeholder"

  # ===== JWT Secret（建议 32 字节以上随机串）=====
  TCM_JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"

  # ===== LLM API Key（生产建议改走 Vault 动态获取）=====
  TCM_LLM_API_KEY: "CHANGE_ME_LLM_API_KEY"

  # ===== Embedding API Key =====
  TCM_EMBEDDING_API_KEY: "CHANGE_ME_EMBEDDING_API_KEY"
