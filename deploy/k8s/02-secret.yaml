# TCM-History-AI 敏感凭据（占位）
# !!! 警告：以下均为 CHANGE_ME 占位值，禁止直接用于生产 !!!
#
# 生产推荐流程（任选其一）：
#   1. 短期：用 Sealed Secrets / SOPS 加密后提交 GitOps 仓库
#   2. 长期：高敏密钥（LLM API Key）走 HashiCorp Vault 动态获取，不入仓库
#   3. 推荐：启用 ExternalSecrets Operator，由 ESO 从 Vault/AWS SM 同步生成同名 Secret
#      （对应 Helm chart 的 externalSecrets.enabled=true，见 deploy/helm/tcm-history-ai/templates/external-secrets.yaml）
#
# 短期临时注入（kubectl 命令示例）：
#   kubectl -n tcm-history-ai create secret generic tcm-secret \
#     --from-literal=TCM_DB_PASSWORD=$(openssl rand -base64 32) \
#     --from-literal=TCM_JWT_SECRET=$(openssl rand -base64 48) \
#     --from-literal=TCM_LLM_API_KEY=sk-... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 详见 doc/14-部署方案.md 第 9.3 节、doc/16-Kubernetes部署.md 第 4.2 节
apiVersion: v1
kind: Secret
metadata:
  name: tcm-secret
  namespace: tcm-history-ai
  labels:
    app.kubernetes.io/name: tcm-history-ai
    app.kubernetes.io/component: secret
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # ===== PostgreSQL 密码（≥ 32 字节强随机串）=====
  TCM_DB_PASSWORD: "CHANGE_ME"

  # ===== Redis 密码 =====
  TCM_REDIS_PASSWORD: "CHANGE_ME"

  # ===== Neo4j 密码 =====
  TCM_NEO4J_PASSWORD: "CHANGE_ME"

  # ===== MinIO 访问密钥 =====
  TCM_MINIO_ACCESS_KEY: "CHANGE_ME"
  TCM_MINIO_SECRET_KEY: "CHANGE_ME"

  # ===== Meilisearch Master Key（≥ 16 字节）=====
  TCM_MEILI_API_KEY: "CHANGE_ME"

  # ===== RabbitMQ 密码 =====
  TCM_RABBITMQ_PASSWORD: "CHANGE_ME"

  # ===== JWT Secret（≥ 32 字节随机串）=====
  TCM_JWT_SECRET: "CHANGE_ME"

  # ===== LLM API Key（生产建议改走 Vault 动态获取）=====
  TCM_LLM_API_KEY: "CHANGE_ME"

  # ===== Embedding API Key =====
  TCM_EMBEDDING_API_KEY: "CHANGE_ME"
