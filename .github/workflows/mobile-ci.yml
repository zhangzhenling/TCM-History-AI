name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_CACHE_KEY: flutter-stable

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release --flavor dev
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Build App Bundle
        run: flutter build appbundle --release --flavor dev
      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-android-aab
          path: mobile/build/app/outputs/bundle/devRelease/app-dev-release.aab
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Upload iOS build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-ios-build
          path: |
            mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 30

  release-draft:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-android-apk
          path: release/android
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-android-aab
          path: release/android
      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-ios-build
          path: release/ios
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#mobile-v}" >> $GITHUB_OUTPUT
      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          name: Mobile v${{ steps.version.outputs.version }}
          draft: true
          files: |
            release/android/app-dev-release.apk
            release/android/app-dev-release.aab
            release/ios/Runner.app
          body: |
            # TCM-History-AI 移动端 v${{ steps.version.outputs.version }}
            
            ## 变更说明
            
            <!-- 在此填写本次版本的变更说明 -->
            
            ## 构建信息
            
            - 版本: ${{ steps.version.outputs.version }}
            - 构建号: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            
            ## 下载
            
            - Android APK: `app-dev-release.apk`
            - Android App Bundle: `app-dev-release.aab`
            - iOS: `Runner.app` (无签名，需自行签名后安装)
            
            ## 安装说明
            
            ### Android
            下载 APK 后直接安装即可。
            
            ### iOS
            1. 解压 Runner.app 后，使用 Xcode 或 Apple Configurator 安装到设备。
            2. 或使用自有签名证书重新签名后安装。
