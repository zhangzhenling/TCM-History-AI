name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_CACHE_KEY: flutter-stable

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release --flavor dev
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Build App Bundle
        run: flutter build appbundle --release --flavor dev
      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-android-aab
          path: mobile/build/app/outputs/bundle/devRelease/app-dev-release.aab
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: analyze-test
    env:
      HAVE_SIGN_SECRETS: ${{ secrets.IOS_P12_BASE64 != ''
        && secrets.IOS_P12_PASSWORD != ''
        && secrets.IOS_DEVELOPMENT_TEAM != ''
        && secrets.IOS_CODE_SIGN_IDENTITY != ''
        && secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_CACHE_KEY }}-macos
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version
      - name: Pod install
        working-directory: mobile/ios
        run: pod install --repo-update

      # ====== 签名准备：导入证书与描述文件 ======
      - name: Import code signing materials
        if: env.HAVE_SIGN_SECRETS == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain: temp-sign-ci
          keychain-password: ci-temp-$RUNNER_TRACKING_ID
      - name: Install provisioning profile
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: |
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          PROF_FILE="$PROF_DIR/$(uuidgen).mobileprovision"
          echo -n "${{ secrets.IOS_MOBILEPROVISION_BASE64 }}" | base64 -d -o "$PROF_FILE"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$(security cms -D -i "$PROF_FILE")")
          mv "$PROF_FILE" "$PROF_DIR/${UUID}.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Generate ExportOptions.plist
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: |
          EXPORT_METHOD="${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}"
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${{ secrets.IOS_CODE_SIGN_IDENTITY }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tcmhistory.tcmHistoryAi</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Write signing xcconfig
        if: env.HAVE_SIGN_SECRETS == 'true'
        working-directory: mobile/ios/Flutter
        run: |
          cat > Signing.xcconfig <<CONF
          DEVELOPMENT_TEAM = ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_SPECIFIER = ${PROVISIONING_PROFILE_UUID}
          PRODUCT_BUNDLE_IDENTIFIER = com.tcmhistory.tcmHistoryAi
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          CONF

      # ====== 分支 A：有证书 → 签名 IPA ======
      - name: Build signed IPA
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: flutter build ipa --release --export-options-plist /tmp/ExportOptions.plist
      - name: Upload IPA artifact
        if: always() && env.HAVE_SIGN_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 30

      # ====== 分支 B：无证书 → 回退 no-codesign ======
      - name: Build iOS (no codesign fallback)
        if: env.HAVE_SIGN_SECRETS != 'true'
        run: flutter build ios --release --no-codesign
      - name: Upload Runner.app artifact (fallback)
        if: always() && env.HAVE_SIGN_SECRETS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tcm-history-ai-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 30

  release-draft:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    permissions:
      contents: write
    env:
      HAVE_SIGN_SECRETS: ${{ secrets.IOS_P12_BASE64 != ''
        && secrets.IOS_P12_PASSWORD != ''
        && secrets.IOS_DEVELOPMENT_TEAM != ''
        && secrets.IOS_CODE_SIGN_IDENTITY != ''
        && secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-android-apk
          path: release/android
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-android-aab
          path: release/android
      - name: Download iOS IPA (signed path)
        if: env.HAVE_SIGN_SECRETS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-ios-ipa
          path: release/ios
      - name: Download iOS Runner.app (fallback path)
        if: env.HAVE_SIGN_SECRETS != 'true'
        uses: actions/download-artifact@v4
        with:
          name: tcm-history-ai-ios-build
          path: release/ios
      - name: List release dir (debug)
        run: find release -maxdepth 3 -type f | sort
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#mobile-v}" >> $GITHUB_OUTPUT
      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          name: Mobile v${{ steps.version.outputs.version }}
          draft: true
          files: |
            release/android/app-dev-release.apk
            release/android/app-dev-release.aab
            release/ios/Runner.app
            release/ios/*.ipa
          body: |
            # TCM-History-AI 移动端 v${{ steps.version.outputs.version }}

            ## 变更说明

            <!-- 在此填写本次版本的变更说明 -->

            ## 构建信息

            - 版本: ${{ steps.version.outputs.version }}
            - 构建号: ${{ github.run_number }}
            - Commit: ${{ github.sha }}

            ## 下载

            - Android APK: `app-dev-release.apk`
            - Android App Bundle: `app-dev-release.aab`
            - iOS: `${{ env.HAVE_SIGN_SECRETS == 'true' && 'tcm-history-ai-ios-ipa.ipa（已签名，可直接安装）' || 'Runner.app（无签名，需自行签名后安装）' }}`

            ## 安装说明

            ### Android
            下载 APK 后直接安装即可。

            ### iOS
            **如下载到已签名 IPA：**
            - 使用 Apple Configurator 2 拖入设备；或 `ideviceinstaller -i App.ipa` 安装。
            - Ad-Hoc 描述文件需要先把设备 UDID 加入 Apple Developer 后台。

            **如下载到 Runner.app：**
            1. 解压后使用自有开发者证书重签：`codesign -f -s "Apple Development: Your Name (TEAMID)" Runner.app`
            2. Xcode → Window → Devices and Simulators → 选中设备 → "+" 选择重签后的 Runner.app。
            3. 或直接用 Xcode 打开 `mobile/ios/Runner.xcworkspace` 按 ⌘R 一键运行。
