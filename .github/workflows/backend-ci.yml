name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # go.mod 要求 go 1.25.0；GOTOOLCHAIN=auto 允许 Go 1.22 引导自动下载所需 toolchain
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: backend
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.txt
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build all services
        run: |
          mkdir -p bin
          for svc in gateway user-service history-service knowledge-service graph-service ai-service learning-service; do
            if [ -d "$svc/cmd/$svc" ]; then
              echo "==> building $svc"
              go build -o "bin/$svc" "./$svc/cmd/$svc" || exit 1
            else
              echo "==> skip $svc (directory not present yet)"
            fi
          done
          echo "==> build finished"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-bin
          path: backend/bin/
          if-no-files-found: warn

  integration:
    name: Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: auto
      # 覆盖 testdata/config.test.yaml 中的默认值，使其指向 service container
      TCM_DB_HOST: localhost
      TCM_DB_PORT: "5432"
      TCM_DB_USER: postgres
      TCM_DB_PASSWORD: postgres
      TCM_DB_DBNAME: tcm_history_test
      TCM_RABBITMQ_HOST: localhost
      TCM_RABBITMQ_PORT: "5672"
      TCM_RABBITMQ_USER: guest
      TCM_RABBITMQ_PASSWORD: guest
    # 真实集成测试较慢，仅在 main/develop 分支或 PR 时触发；
    # 通过 paths 过滤避免文档改动也触发。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcm_history_test
        # 健康检查：等待 PostgreSQL 真正可接受连接
        options: >-
          --health-cmd "pg_isready -U postgres -d tcm_history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      # 1. 编译验证（不需要真实依赖）：必须通过
      - name: Compile-check integration tests
        run: go build -tags=integration ./test/integration/...
      - name: Vet integration tests
        run: go vet -tags=integration ./test/integration/...
      # 2. 编译验证（不实际跑用例）：必须通过
      - name: Compile-run integration tests (no exec)
        run: go test -tags=integration -run='^$' ./test/integration/...
      # 3. 真实运行集成测试：service containers 已就绪
      - name: Run integration tests
        run: go test -tags=integration -v -timeout=5m ./test/integration/...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Compile-check E2E tests
        run: go build -tags=e2e ./gateway/internal/e2e/...
      - name: Run E2E tests
        run: go test -tags=e2e -race -v -timeout=2m ./gateway/internal/e2e/...
