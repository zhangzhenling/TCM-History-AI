name: Release

# 统一的平台级发布流程：推送 `v*` 标签（如 v1.0.0）触发
# - 后端 7 服务二进制（linux amd64 + arm64）+ 校验和
# - 前端 admin + learner 生产构建压缩包
# - 移动端 Android APK / AAB
# - 7 个服务 Docker 镜像推送 GHCR（多架构）
# - 自动创建 GitHub Release 并附带全部产物
#
# 与 mobile-ci.yml 中 `mobile-v*` 标签触发的「纯移动端发布」并存：
# - `v*`         → 全平台统一发布（本工作流）
# - `mobile-v*`  → 仅移动端补丁发布（mobile-ci.yml）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v1.0.0，无需前缀也可）'
        required: true

permissions:
  contents: write   # 创建 Release / 上传资源
  packages: write   # 推送 GHCR 镜像

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 准备：解析版本号，供下游 job 复用
  # ------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image_repo: ${{ steps.image.outputs.repo }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # 兼容用户输入不带 v 前缀的情况
            [[ "$TAG" != v* ]] && TAG="v$TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "解析到版本：$VERSION （标签：$TAG）"
      - name: Compute lowercased image repo
        id: image
        run: |
          # GHCR 镜像名必须小写
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=$REPO" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # 后端：7 个服务二进制，按 GOOS/GOARCH 矩阵构建
  # ------------------------------------------------------------------
  backend:
    name: Backend (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build all services
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for svc in gateway user-service history-service knowledge-service graph-service ai-service learning-service; do
            if [ ! -d "./$svc/cmd/$svc" ]; then
              echo "==> skip $svc (cmd dir not found)"
              continue
            fi
            echo "==> building $svc (${{ matrix.goos }}/${{ matrix.goarch }})"
            go build -trimpath -ldflags="-s -w" \
              -o "dist/${svc}" \
              "./$svc/cmd/$svc" || exit 1
          done
      - name: Package & checksum
        id: pkg
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCHIVE="tcm-backend-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -C backend/dist -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tcm-backend-*.tar.gz
            tcm-backend-*.tar.gz.sha256
          retention-days: 7

  # ------------------------------------------------------------------
  # 前端：admin + learner 生产构建
  # ------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build learner
        working-directory: frontend
        run: pnpm build
      - name: Build admin
        working-directory: frontend
        run: pnpm build:admin
      - name: Package & checksum
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd frontend
          tar -czf "tcm-frontend-learner-${VERSION}.tar.gz" -C apps/learner/dist .
          tar -czf "tcm-frontend-admin-${VERSION}.tar.gz" -C apps/admin/dist .
          sha256sum \
            "tcm-frontend-learner-${VERSION}.tar.gz" \
            "tcm-frontend-admin-${VERSION}.tar.gz" \
            > "tcm-frontend-${VERSION}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            frontend/tcm-frontend-*.tar.gz
            frontend/tcm-frontend-*.sha256
          retention-days: 7

  # ------------------------------------------------------------------
  # 移动端：Android APK / AAB（与 mobile-ci.yml 中的构建保持一致）
  # ------------------------------------------------------------------
  mobile:
    name: Mobile (Android)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --flavor dev
      - name: Build AAB
        working-directory: mobile
        run: flutter build appbundle --release --flavor dev
      - name: Stage & checksum
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          STAGE="$(mktemp -d)"
          cp mobile/build/app/outputs/flutter-apk/app-dev-release.apk "$STAGE/tcm-mobile-${VERSION}.apk"
          cp mobile/build/app/outputs/bundle/devRelease/app-dev-release.aab "$STAGE/tcm-mobile-${VERSION}.aab"
          ( cd "$STAGE" && sha256sum tcm-mobile-${VERSION}.apk tcm-mobile-${VERSION}.aab > tcm-mobile-${VERSION}.sha256 )
          echo "STAGE=$STAGE" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: |
            ${{ env.STAGE }}/tcm-mobile-*.apk
            ${{ env.STAGE }}/tcm-mobile-*.aab
            ${{ env.STAGE }}/tcm-mobile-*.sha256
          retention-days: 7

  # ------------------------------------------------------------------
  # 移动端：iOS IPA（优先签名导出可直接安装的 IPA；无证书时回退 no-codesign）
  #
  # 【前提】如要导出签名 IPA，需在仓库 Settings → Secrets and variables → Actions
  #         添加以下 Repository secrets（缺一不可）：
  #   IOS_P12_BASE64                 — .p12 证书文件的 base64 编码
  #                                     (base64 -i Certificates.p12 | pbcopy)
  #   IOS_P12_PASSWORD              — .p12 的导出密码
  #   IOS_DEVELOPMENT_TEAM          — 团队 ID，如 ABC123XYZ
  #   IOS_CODE_SIGN_IDENTITY        — 证书标识名，如
  #                                     "iPhone Distribution: XXX Ltd (ABC123XYZ)"
  #                                     或 "Apple Development: My Name (ABC123XYZ)"
  #   IOS_MOBILEPROVISION_BASE64    — 匹配 Bundle ID 的 .mobileprovision 描述文件
  #                                     的 base64 编码
  #   IOS_EXPORT_METHOD             — app-store | ad-hoc | development | enterprise
  #                                     （默认：ad-hoc）
  #
  # 【未配置 secrets】自动回退为 --no-codesign，输出 Runner.app.zip 本地重签用
  # ------------------------------------------------------------------
  mobile-ios:
    name: Mobile (iOS)
    needs: prepare
    runs-on: macos-14
    env:
      HAVE_SIGN_SECRETS: ${{ secrets.IOS_P12_BASE64 != ''
        && secrets.IOS_P12_PASSWORD != ''
        && secrets.IOS_DEVELOPMENT_TEAM != ''
        && secrets.IOS_CODE_SIGN_IDENTITY != ''
        && secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-macos
      - name: Install dependencies
        working-directory: mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Ensure GeneratedPluginRegistrant.swift exists
        working-directory: mobile/ios/Runner
        run: |
          if [ ! -f GeneratedPluginRegistrant.swift ]; then
            cat > GeneratedPluginRegistrant.swift <<'SWIFT'
          //
          //  Generated file. Do not edit.
          //

          import Flutter
          import UIKit

          class GeneratedPluginRegistrant: NSObject {
            static func register(with registry: FlutterPluginRegistry) {
            }
          }
          SWIFT
            echo "Created placeholder GeneratedPluginRegistrant.swift"
          else
            echo "GeneratedPluginRegistrant.swift already exists"
          fi

      # ====== 签名准备：导入证书与描述文件 ======
      - name: Import code signing materials
        if: env.HAVE_SIGN_SECRETS == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain: temp-sign-ci
          keychain-password: ci-temp-$RUNNER_TRACKING_ID
      - name: Install provisioning profile
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: |
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          PROF_FILE="$PROF_DIR/$(uuidgen).mobileprovision"
          echo -n "${{ secrets.IOS_MOBILEPROVISION_BASE64 }}" | base64 -d -o "$PROF_FILE"
          # 从描述文件中提取 UUID，便于后续在 ExportOptions 中引用
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$(security cms -D -i "$PROF_FILE")")
          mv "$PROF_FILE" "$PROF_DIR/${UUID}.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "导入描述文件 UUID: $UUID"
      - name: Generate ExportOptions.plist
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: |
          EXPORT_METHOD="${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}"
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${{ secrets.IOS_CODE_SIGN_IDENTITY }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tcmhistory.tcmHistoryAi</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          cat /tmp/ExportOptions.plist
      - name: Write signing xcconfig
        if: env.HAVE_SIGN_SECRETS == 'true'
        working-directory: mobile/ios/Flutter
        run: |
          # 写入实际使用的 Signing.xcconfig，覆盖模板占位
          cat > Signing.xcconfig <<CONF
          DEVELOPMENT_TEAM = ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_SPECIFIER = ${PROVISIONING_PROFILE_UUID}
          PRODUCT_BUNDLE_IDENTIFIER = com.tcmhistory.tcmHistoryAi
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          CONF

      # ====== 分支 A：有证书 → flutter build ipa ======
      - name: Build signed IPA
        if: env.HAVE_SIGN_SECRETS == 'true'
        working-directory: mobile
        run: |
          flutter build ipa --release \
            --export-options-plist /tmp/ExportOptions.plist
      - name: Stage signed IPA & dSYM
        if: env.HAVE_SIGN_SECRETS == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          STAGE="$(mktemp -d)"
          # flutter build ipa 默认输出在 build/ios/ipa/Runner.ipa
          cp mobile/build/ios/ipa/*.ipa "$STAGE/tcm-mobile-${VERSION}.ipa" 2>/dev/null || \
            cp mobile/build/ios/ipa/Runner.ipa "$STAGE/tcm-mobile-${VERSION}.ipa"
          # dSYM 通常在 build/ios/archive/Runner.xcarchive/dSYMs/
          ARCHIVE_DSYM_DIR="mobile/build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -d "$ARCHIVE_DSYM_DIR" ]; then
            ( cd "$ARCHIVE_DSYM_DIR" && zip -ry "$STAGE/tcm-mobile-${VERSION}-ios-dSYM.zip" . )
          fi
          ( cd "$STAGE" && shasum -a 256 *.ipa *.zip > tcm-mobile-${VERSION}-ios.sha256 2>/dev/null || \
                       shasum -a 256 *.ipa           > tcm-mobile-${VERSION}-ios.sha256 )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # ====== 分支 B：无证书 → 回退 no-codesign Runner.app.zip ======
      - name: Build iOS (no codesign fallback)
        if: env.HAVE_SIGN_SECRETS != 'true'
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package Runner.app & dSYM (fallback)
        if: env.HAVE_SIGN_SECRETS != 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          STAGE="$(mktemp -d)"
          cd mobile/build/ios/iphoneos
          zip -ry "$STAGE/tcm-mobile-${VERSION}-ios-Runner.app.zip" Runner.app
          if [ -d "../Build/Intermediates.noindex/ArchiveIntermediates/Runner/BuildProductsPath/Release-iphoneos/Runner.app.dSYM" ]; then
            ( cd "../Build/Intermediates.noindex/ArchiveIntermediates/Runner/BuildProductsPath/Release-iphoneos" && \
              zip -ry "$STAGE/tcm-mobile-${VERSION}-ios-dSYM.zip" Runner.app.dSYM )
          fi
          ( cd "$STAGE" && shasum -a 256 *.zip > tcm-mobile-${VERSION}-ios.sha256 )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # ====== 上传产物（两条分支共用） ======
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: |
            ${{ env.STAGE }}/tcm-mobile-*.ipa
            ${{ env.STAGE }}/tcm-mobile-*-ios-*.zip
            ${{ env.STAGE }}/tcm-mobile-*-ios.sha256
          retention-days: 7

  # ------------------------------------------------------------------
  # Docker：7 个服务镜像，多架构推送到 GHCR
  # ------------------------------------------------------------------
  docker:
    name: Docker ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user-service, history-service, knowledge-service, graph-service, ai-service, learning-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.image_repo }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=TCM-History-AI ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------
  # Docker：前端镜像（learner + admin 多阶段构建，推送到 GHCR）
  # ------------------------------------------------------------------
  docker-frontend:
    name: Docker frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.image_repo }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=TCM-History-AI frontend
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ------------------------------------------------------------------
  # 发布：聚合全部产物，创建 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [prepare, backend, frontend, mobile, docker, docker-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: release/frontend
      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: release/mobile
      - name: Download mobile-ios artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-ios
          path: release/mobile-ios
        continue-on-error: true
      - name: Download backend linux/amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-amd64
          path: release/backend-linux-amd64
      - name: Download backend linux/arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-arm64
          path: release/backend-linux-arm64
      - name: Flatten artifact layout
        run: |
          mkdir -p assets
          find release -type f \( -name '*.tar.gz' -o -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} assets/ \;
          echo "=== assets ==="
          ls -la assets/
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | head -80)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TCM-History-AI v${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: false
          body: |
            # TCM-History-AI v${{ needs.prepare.outputs.version }}

            ## 构建产物

            ### 后端服务
            - `tcm-backend-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz` — 7 个后端服务二进制（Linux x86_64）
            - `tcm-backend-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz` — 7 个后端服务二进制（Linux ARM64）

            ### 前端
            - `tcm-frontend-learner-${{ needs.prepare.outputs.version }}.tar.gz` — 学习端生产构建
            - `tcm-frontend-admin-${{ needs.prepare.outputs.version }}.tar.gz` — 管理后台生产构建

            ### 移动端
            - `tcm-mobile-${{ needs.prepare.outputs.version }}.apk` — Android APK
            - `tcm-mobile-${{ needs.prepare.outputs.version }}.aab` — Android App Bundle
            - `tcm-mobile-${{ needs.prepare.outputs.version }}.ipa` — iOS App（签名后可直接安装）
            - `tcm-mobile-${{ needs.prepare.outputs.version }}-ios-Runner.app.zip` — iOS Runner.app（**仅当未配置签名证书时发布**，需本地重签）
            - `tcm-mobile-${{ needs.prepare.outputs.version }}-ios-dSYM.zip` — iOS dSYM 符号表（可选，用于符号化崩溃日志）

            > 💡 两种 iOS 产物根据是否配置签名 Secrets 自动二选一发布，不会同时出现。
            >
            > **【推荐】有签名 IPA → 直接安装：**
            > ```bash
            > # 使用 ideviceinstaller（brew install ideviceinstaller）
            > ideviceinstaller -i tcm-mobile-*.ipa
            > # 或使用 Apple Configurator 2 拖入 iPhone
            > ```
            > **无签名 Runner.app.zip → 本地重签后安装：**
            > ```bash
            > unzip tcm-mobile-*-ios-Runner.app.zip
            > codesign -f -s "Apple Development: Your Name (TEAMID)" Runner.app
            > ideviceinstaller -i Runner.app   # 或 Xcode → Devices and Simulators → "+"
            > ```
            > **最快方式：** Xcode 打开 `mobile/ios/Runner.xcworkspace` 连手机按 ⌘R。
            >
            > **开启签名 IPA（一次性配置）**：在仓库 Settings → Secrets and variables → Actions
            > 添加 6 个 Repository secrets，详情见 release.yml Mobile (iOS) job 注释。

            ### Docker 镜像（GHCR，多架构）
            - `ghcr.io/${{ needs.prepare.outputs.image_repo }}/gateway:${{ needs.prepare.outputs.version }}`
            - `ghcr.io/${{ needs.prepare.outputs.image_repo }}/user-service:${{ needs.prepare.outputs.version }}`
            - `ghcr.io/${{ needs.prepare.outputs.image_repo }}/history-service:${{ needs.prepare.outputs.version }}`
