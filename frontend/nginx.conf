# TCM-History-AI 前端 Nginx 配置
#
# 两个 server block 分别托管 learner 和 admin：
#   80   → learner（学习端 SPA）
#   8088 → admin  （管理后台 SPA）
#
# 两个端口均将 /api、/health 反代到 gateway 服务（docker compose 服务名）。
# SPA history 模式通过 try_files 回退到 index.html 实现。

# ---------- 公共反代头 ----------
# 后端 Gateway 地址，docker compose 网络内通过服务名解析。
# 如需独立部署，可用环境变量替换或修改此处。

# ---------- learner（学习端）----------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/learner;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（Vite 产物带 hash，可安全缓存一年）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Gateway
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查反代
    location /health {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- admin（管理后台）----------
server {
    listen 8088;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
